# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9fa37b4198518ce67667f05db0cd1d2b"
name = "size_norm"
handle = "size-norm"
application_url = "https://size-norm-app.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# Keep this list minimal — App Store review asks apps to justify every scope,
# and a shorter permission prompt converts better at install.
#
# write_products covers everything we do: reading products/variants, writing
# the size_norm metafields, creating those metafield definitions (access to
# metafield definitions derives from the owner resource, PRODUCT and
# PRODUCTVARIANT here), and flipping status/tags on conversion failure.
#
# The metaobject scopes that used to be here were never exercised by any code
# path — metaobjects are a separate feature this app doesn't use.
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-04"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Handled by: /app/routes/webhooks.products.create.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = ["products/create"]

  # Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = ["products/update"]

  # ── Mandatory compliance topics (required for public distribution) ──
  # These use `compliance_topics`, not `topics`. Shopify calls them even
  # when the app is uninstalled, so the handlers must not assume a session.
  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://size-norm-app.vercel.app/auth/callback" ]

[build]
# Keep our production URL on Shopify even when running `shopify app dev`
# locally. If we ever wire up a tunnel for local dev we'll set this to true
# temporarily.
automatically_update_urls_on_dev = false
